name: Apply Ultra Calculators

on:
  push:
    paths:
      - '.github/workflows/apply-ultra-calculators.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enhance calculators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          style=r'''<style id="ultra-calc-v1">
/* Ultra Calculators v1 — native SVG, same calculation engine, no heavy chart library */
#calculadoras .tabs{padding:.45rem;border:1px solid rgba(10,25,47,.09);border-radius:999px;background:rgba(255,255,255,.72);box-shadow:0 12px 32px -26px rgba(10,25,47,.55);width:max-content;max-width:100%;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#calculadoras .tab{position:relative;overflow:hidden;border-color:transparent;margin:0;transition:transform .28s cubic-bezier(.22,1,.36,1),background .28s,color .28s,box-shadow .28s}
#calculadoras .tab[aria-selected="true"]{box-shadow:0 10px 24px -15px rgba(10,25,47,.75)}
@media(hover:hover) and (pointer:fine){#calculadoras .tab:hover{transform:translateY(-1px)}}
#calculadoras .calc{position:relative;overflow:clip;border-color:rgba(10,25,47,.10);box-shadow:0 30px 70px -42px rgba(10,25,47,.45);background:linear-gradient(145deg,#fff 0%,#fbfcfe 70%,#f4f7fb 100%)}
#calculadoras .calc::before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-220px;top:-250px;background:radial-gradient(circle,rgba(212,175,55,.12),transparent 68%);pointer-events:none}
#calculadoras .calc>div{position:relative;z-index:1}
#calculadoras .field input,#calculadoras .field select{transition:border-color .25s,background .25s,box-shadow .25s,transform .25s}
#calculadoras .field input:focus,#calculadoras .field select:focus{box-shadow:0 0 0 4px rgba(22,52,91,.08),0 14px 26px -22px rgba(10,25,47,.7);transform:translateY(-1px)}
#calculadoras .calc__out{overflow:hidden;border:1px solid rgba(212,175,55,.17);background:radial-gradient(110% 70% at 95% 0%,rgba(31,83,145,.24),transparent 56%),linear-gradient(155deg,#0A192F 0%,#10294A 100%);box-shadow:0 28px 58px -38px rgba(4,10,20,.85)}
#calculadoras .calc__big{font-variant-numeric:tabular-nums;text-shadow:0 8px 28px rgba(212,175,55,.12)}
.calc-viz{position:relative;margin-top:1.2rem;padding-top:1.15rem;border-top:1px solid rgba(255,255,255,.11);opacity:0;transform:translateY(8px)}
.calc-viz.is-animated{animation:vizEnter .56s cubic-bezier(.22,1,.36,1) both}
@keyframes vizEnter{to{opacity:1;transform:none}}
.viz-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem}
.viz-kicker{display:flex;align-items:center;gap:.48rem;font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:#C9D5E6}
.viz-live{width:7px;height:7px;border-radius:50%;background:#2FBF87;box-shadow:0 0 0 5px rgba(47,191,135,.1)}
.viz-engine{font-family:"IBM Plex Mono",monospace;font-size:.54rem;letter-spacing:.08em;color:#8095B2;border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:.28rem .5rem;white-space:nowrap}
.viz-panel{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:.85rem;background:rgba(255,255,255,.025);overflow:hidden}
.viz-grid{display:grid;gap:.7rem;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:.7rem}
.viz-metric{padding:.72rem;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.025)}
.viz-metric span{display:block;font-family:"IBM Plex Mono",monospace;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:#7F95B1;margin-bottom:.2rem}
.viz-metric b{display:block;color:#F8F9FA;font-size:.9rem;line-height:1.25;font-variant-numeric:tabular-nums}
.viz-metric--gold b{color:#D4AF37}
.viz-title{font-size:.76rem;color:#AFC0D6;margin-bottom:.65rem;display:flex;justify-content:space-between;gap:1rem}
.viz-title b{color:#F8F9FA;font-weight:600}
.viz-track{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.viz-seg{height:100%;transform-origin:left center;transform:scaleX(0)}
.is-animated .viz-seg{animation:vizGrow .8s cubic-bezier(.22,1,.36,1) forwards}
.is-animated .viz-seg:nth-child(2){animation-delay:.08s}.is-animated .viz-seg:nth-child(3){animation-delay:.16s}
@keyframes vizGrow{to{transform:scaleX(1)}}
.viz-gold{background:linear-gradient(90deg,#C59C33,#E9CB72)}.viz-blue{background:linear-gradient(90deg,#1E4E8C,#3D7BC3)}.viz-teal{background:linear-gradient(90deg,#0E7C93,#28A8B8)}.viz-muted{background:#60758F}
.viz-legend{display:flex;flex-wrap:wrap;gap:.55rem .85rem;margin-top:.55rem;font-size:.62rem;color:#8FA3BC}
.viz-legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:.28rem}
.viz-ringrow{display:grid;grid-template-columns:84px 1fr;gap:.9rem;align-items:center}
.viz-ring{width:82px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#D4AF37 var(--pct),rgba(255,255,255,.09) 0);position:relative;transform:scale(.92);opacity:0}
.viz-ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#102744}
.viz-ring span{position:relative;z-index:1;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:.65rem;color:#F8F9FA;line-height:1.2}
.is-animated .viz-ring{animation:ringIn .65s .12s cubic-bezier(.22,1,.36,1) forwards}@keyframes ringIn{to{transform:none;opacity:1}}
.viz-chart{width:100%;height:auto;overflow:visible}
.viz-gridline{stroke:rgba(255,255,255,.08);stroke-width:1;vector-effect:non-scaling-stroke}
.viz-area{fill:url(#retireArea)}
.viz-line{fill:none;stroke:#D4AF37;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
.is-animated .viz-line{animation:drawLine 1.15s .08s cubic-bezier(.22,1,.36,1) forwards}@keyframes drawLine{to{stroke-dashoffset:0}}
.viz-dot{fill:#D4AF37;stroke:#102744;stroke-width:3;opacity:0}.is-animated .viz-dot{animation:dotIn .35s .85s ease forwards}@keyframes dotIn{to{opacity:1}}
.viz-axis{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:#7086A3}
.viz-bars{height:118px;display:flex;align-items:end;gap:.45rem;padding:.6rem .15rem .1rem;border-bottom:1px solid rgba(255,255,255,.08)}
.viz-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%}
.viz-col i{display:block;width:min(32px,80%);height:var(--h);min-height:3px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#E9CB72,#9D771E);transform:scaleY(0);transform-origin:bottom}
.is-animated .viz-col i{animation:colGrow .78s cubic-bezier(.22,1,.36,1) forwards}.is-animated .viz-col:nth-child(2) i{animation-delay:.07s}.is-animated .viz-col:nth-child(3) i{animation-delay:.14s}.is-animated .viz-col:nth-child(4) i{animation-delay:.21s}
@keyframes colGrow{to{transform:scaleY(1)}}
.viz-col small{font-family:"IBM Plex Mono",monospace;font-size:.52rem;color:#7187A3;margin-top:.3rem;white-space:nowrap}
.viz-note{font-size:.65rem;color:#7187A3;line-height:1.45;margin-top:.65rem}
@media(max-width:650px){#calculadoras .tabs{width:100%;border-radius:20px;display:grid;grid-template-columns:1fr 1fr}.viz-engine{display:none}.viz-grid{grid-template-columns:1fr 1fr}.viz-ringrow{grid-template-columns:74px 1fr}.viz-ring{width:72px}.calc-viz{margin-top:1rem}}
@media(max-width:390px){.viz-grid{grid-template-columns:1fr}.viz-ringrow{grid-template-columns:1fr}.viz-ring{margin:auto}}
@media(prefers-reduced-motion:reduce){.calc-viz{opacity:1!important;transform:none!important;animation:none!important}.viz-seg,.viz-col i{transform:none!important;animation:none!important}.viz-ring{opacity:1!important;transform:none!important;animation:none!important}.viz-line{stroke-dashoffset:0!important;animation:none!important}.viz-dot{opacity:1!important;animation:none!important}}
</style>'''

          script=r'''<script id="ultra-calc-v1-js">
(()=>{
'use strict';
const IC=window.InsuranceCalculators;
if(!IC)return;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const USD=new Intl.NumberFormat('es-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const N=v=>{const n=Number(String(v??'').replace(/[$,\s%]/g,''));return Number.isFinite(n)?n:0};
const configs={
 vida:{prefix:'cv',fn:'lifeInsuranceNeed',pct:[],fields:['annualIncome','replacementYears','mortgageBalance','otherDebts','educationGoal','finalExpenses','otherGoals','existingCoverage','liquidAssets']},
 retiro:{prefix:'cr',fn:'retirementProjection',pct:['annualReturn','annualInflation','withdrawalRate'],fields:['currentAge','retirementAge','currentSavings','monthlyContribution','annualReturn','annualInflation','withdrawalRate','planningAge']},
 salud:{prefix:'cs',fn:'annualHealthCost',pct:['coinsuranceRate'],fields:['monthlyPremium','expectedAllowedCharges','deductible','coinsuranceRate','annualCopays','outOfPocketMaximum','nonCoveredCosts','outOfNetworkCosts']},
 uni:{prefix:'cu',fn:'collegeSavings',pct:['collegeInflation','annualReturn'],fields:['currentAnnualCost','yearsUntilCollege','yearsInCollege','collegeInflation','currentSavings','annualReturn']}
};
function collect(key){const c=configs[key],o={};c.fields.forEach(f=>{const el=document.getElementById(`${c.prefix}-${f}`);let v=N(el?.value);if(c.pct.includes(f))v/=100;o[f]=v});return o}
function engine(key,input){return IC[configs[key].fn](input)}
function head(){return `<div class="viz-head"><span class="viz-kicker"><i class="viz-live"></i>Visualización del resultado</span><span class="viz-engine">mismo motor de cálculo</span></div>`}
function metric(label,value,gold=false){return `<div class="viz-metric${gold?' viz-metric--gold':''}"><span>${label}</span><b>${value}</b></div>`}
function mount(key,html){const out=document.getElementById(`out-${key}`);if(!out)return;out.querySelector('.calc-viz')?.remove();const node=document.createElement('div');node.className='calc-viz';node.dataset.viz=key;node.innerHTML=head()+html;out.appendChild(node);animate(node)}
function animate(node){if(reduce){node.classList.add('is-animated');return}const go=()=>requestAnimationFrame(()=>node.classList.add('is-animated'));if(!('IntersectionObserver'in window)){go();return}const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){go();io.disconnect()}},{threshold:.22});io.observe(node)}
function life(r){const b=r.breakdown,g=Math.max(1,b.grossNeed),p1=Math.max(0,b.incomeReplacement)/g*100,p2=Math.max(0,b.obligationsAndGoals)/g*100,cov=Math.min(100,Math.max(0,b.availableResources)/g*100);return `<div class="viz-panel"><div class="viz-title"><span>Composición de la necesidad bruta</span><b>${USD.format(b.grossNeed)}</b></div><div class="viz-track"><i class="viz-seg viz-gold" style="width:${p1}%"></i><i class="viz-seg viz-blue" style="width:${p2}%"></i></div><div class="viz-legend"><span><i class="viz-gold"></i>Ingresos</span><span><i class="viz-blue"></i>Obligaciones y metas</span></div></div><div class="viz-grid"><div class="viz-ringrow viz-panel"><div class="viz-ring" style="--pct:${cov}%"><span>${Math.round(cov)}%<br>cubierto</span></div><div>${metric('Recursos disponibles',USD.format(b.availableResources))}</div></div>${metric('Brecha estimada',USD.format(r.estimatedNeed),true)}</div><p class="viz-note">La proporción visual compara recursos disponibles con la necesidad bruta calculada. Es una referencia educativa, no una recomendación de cobertura.</p>`}
function retire(r){const inp=r.inputs,years=Math.max(0,Math.round(inp.retirementAge-inp.currentAge)),count=Math.min(24,Math.max(2,years+1)),vals=[];for(let i=0;i<count;i++){const t=years*(i/(count-1));const ra=inp.currentAge+t;try{const rr=IC.retirementProjection({...inp,retirementAge:ra,planningAge:Math.max(inp.planningAge,ra+1)});vals.push(rr.results.projectedSavings)}catch{vals.push(i?vals[i-1]:inp.currentSavings)}}const W=520,H=205,P=24,max=Math.max(1,...vals);const pts=vals.map((v,i)=>[P+(W-2*P)*(i/(vals.length-1)),H-P-(H-2*P)*(v/max)]);const path=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');const area=`M${pts[0][0]},${H-P} ${pts.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} L${pts.at(-1)[0]},${H-P} Z`;const grids=[.25,.5,.75].map(q=>`<line class="viz-gridline" x1="${P}" y1="${(P+(H-2*P)*q).toFixed(1)}" x2="${W-P}" y2="${(P+(H-2*P)*q).toFixed(1)}"/>`).join('');return `<div class="viz-panel"><div class="viz-title"><span>Trayectoria proyectada del ahorro</span><b>${USD.format(r.results.projectedSavings)}</b></div><svg class="viz-chart" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="retireArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4AF37" stop-opacity=".28"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></linearGradient></defs>${grids}<path class="viz-area" d="${area}"/><path class="viz-line" pathLength="1" d="${path}"/><circle class="viz-dot" cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="5"/><text class="viz-axis" x="${P}" y="${H-5}">Edad ${Math.round(inp.currentAge)}</text><text class="viz-axis" text-anchor="end" x="${W-P}" y="${H-5}">Edad ${Math.round(inp.retirementAge)}</text></svg></div><div class="viz-grid">${metric('Ingreso mensual de planificación',USD.format(r.results.monthlyPlanningIncome),true)}${metric('Ingreso anual en dólares de hoy',USD.format(r.results.annualIncomeTodayDollars))}</div><p class="viz-note">La curva usa el mismo motor y los mismos supuestos de rendimiento, aportes e inflación. No representa rendimiento garantizado ni una cotización de anualidad.</p>`}
function health(r){const premium=r.results.annualPremium,oop=r.results.estimatedCoveredOutOfPocket,extra=r.inputs.nonCoveredCosts+r.inputs.outOfNetworkCosts,total=Math.max(1,r.results.estimatedTotalAnnualCost);const a=premium/total*100,b=oop/total*100,c=Math.max(0,extra)/total*100;const high=Math.max(total,r.results.highUseScenario);const currentPct=Math.min(100,total/high*100);return `<div class="viz-panel"><div class="viz-title"><span>Composición del costo anual estimado</span><b>${USD.format(r.results.estimatedTotalAnnualCost)}</b></div><div class="viz-track"><i class="viz-seg viz-gold" style="width:${a}%"></i><i class="viz-seg viz-blue" style="width:${b}%"></i><i class="viz-seg viz-teal" style="width:${c}%"></i></div><div class="viz-legend"><span><i class="viz-gold"></i>Primas</span><span><i class="viz-blue"></i>Participación cubierta</span><span><i class="viz-teal"></i>No cubierto / fuera de red</span></div></div><div class="viz-panel" style="margin-top:.7rem"><div class="viz-title"><span>Estimado frente a escenario de uso alto</span><b>${USD.format(r.results.highUseScenario)}</b></div><div class="viz-track"><i class="viz-seg viz-gold" style="width:${currentPct}%"></i></div></div><div class="viz-grid">${metric('Costo mensual equivalente',USD.format(r.results.estimatedTotalAnnualCost/12),true)}${metric('Máximo de bolsillo ingresado',USD.format(r.inputs.outOfPocketMaximum))}</div><p class="viz-note">La barra separa los componentes del estimado. Gastos no cubiertos o fuera de red pueden no contar para el máximo de bolsillo.</p>`}
function college(r){const arr=r.results.projectedCostByAcademicYear||[],max=Math.max(1,...arr),cols=arr.map((v,i)=>`<div class="viz-col"><i style="--h:${Math.max(4,v/max*100)}%"></i><small>Año ${i+1}</small></div>`).join('');const cover=Math.min(100,r.results.totalProjectedCost?Math.max(0,r.results.projectedCurrentSavings/r.results.totalProjectedCost*100):100);return `<div class="viz-panel"><div class="viz-title"><span>Costo proyectado por año académico</span><b>${USD.format(r.results.totalProjectedCost)}</b></div><div class="viz-bars">${cols}</div></div><div class="viz-panel" style="margin-top:.7rem"><div class="viz-title"><span>Ahorro proyectado frente al costo</span><b>${Math.round(cover)}% cubierto</b></div><div class="viz-track"><i class="viz-seg viz-gold" style="width:${cover}%"></i></div></div><div class="viz-grid">${metric('Brecha estimada',USD.format(r.results.fundingGap))}${metric('Aporte mensual estimado',USD.format(r.results.requiredMonthlyContribution),true)}</div><p class="viz-note">Proyección educativa basada en los supuestos introducidos; no incluye becas, ayuda financiera, impuestos ni cambios futuros de matrícula.</p>`}
const renderers={vida:life,retiro:retire,salud:health,uni:college};
function render(key){try{const input=collect(key),r=engine(key,input);mount(key,renderers[key](r,input))}catch{/* The primary calculator already renders validation errors. */}}
Object.keys(configs).forEach(render);
document.querySelectorAll('[data-run]').forEach(btn=>btn.addEventListener('click',()=>requestAnimationFrame(()=>render(btn.dataset.run))));
document.querySelectorAll('[data-reset]').forEach(btn=>btn.addEventListener('click',()=>requestAnimationFrame(()=>document.querySelector(`#out-${btn.dataset.reset} .calc-viz`)?.remove())));
})();
</script>'''

          text=re.sub(r'\n?<style id="ultra-calc-v1">.*?</style>\n?','\n',text,flags=re.S)
          text=re.sub(r'\n?<script id="ultra-calc-v1-js">.*?</script>\n?','\n',text,flags=re.S)
          if '</head>' not in text or '</body>' not in text:
              raise SystemExit('index.html missing closing tags')
          text=text.replace('</head>',style+'\n</head>',1)
          text=text.replace('</body>',script+'\n</body>',1)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Sanity checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'style':s.count('id="ultra-calc-v1"')==1,
            'script':s.count('id="ultra-calc-v1-js"')==1,
            'same engine':"window.InsuranceCalculators" in s,
            'all visualizers':all(x in s for x in ['function life(','function retire(','function health(','function college(']),
            'native svg':'viz-chart' in s and 'retireArea' in s,
            'reduced motion':'prefers-reduced-motion:reduce' in s,
            'existing calculators':all(x in s for x in ['calc-vida','calc-retiro','calc-salud','calc-uni']),
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Failed checks: '+', '.join(bad))
          print('Ultra calculator checks passed')
          PY

      - name: Commit calculator enhancement
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add ultra-modern calculator visual intelligence'
          git push origin HEAD:main
