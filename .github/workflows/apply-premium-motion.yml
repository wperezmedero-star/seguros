name: Apply Premium Motion

on:
  push:
    paths:
      - '.github/workflows/apply-premium-motion.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add premium motion layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          style = r'''<style id="premium-motion-v1">
          /* Premium Motion v1 — subtle, performance-minded, accessible */
          .btn--gold{position:relative;overflow:hidden;isolation:isolate}
          .btn--gold::after{
            content:"";position:absolute;inset:-45% auto -45% -38%;width:24%;pointer-events:none;
            background:linear-gradient(110deg,transparent 0%,rgba(255,255,255,.08) 28%,rgba(255,255,255,.58) 50%,rgba(255,255,255,.08) 72%,transparent 100%);
            transform:translateX(-260%) skewX(-16deg);opacity:0;
            animation:premiumGoldSheen 9.5s cubic-bezier(.22,1,.36,1) 2.8s infinite
          }
          @keyframes premiumGoldSheen{
            0%,68%,100%{transform:translateX(-260%) skewX(-16deg);opacity:0}
            72%{opacity:.42}
            80%{transform:translateX(610%) skewX(-16deg);opacity:0}
          }

          .reveal{transition-delay:var(--motion-delay,0ms)}

          .case{
            transition:transform .42s cubic-bezier(.22,1,.36,1),box-shadow .42s cubic-bezier(.22,1,.36,1),border-color .35s ease
          }
          .motion-ready .caso-icono path{
            stroke-dasharray:60;stroke-dashoffset:60;
            transition:stroke-dashoffset .76s cubic-bezier(.22,1,.36,1)
          }
          .motion-ready .case.motion-in .caso-icono path{stroke-dashoffset:0}
          .motion-ready .case:nth-child(1).motion-in .caso-icono path:nth-child(2){transition-delay:.26s}
          .motion-ready .case:nth-child(3).motion-in .caso-icono path:nth-child(2){transition-delay:.10s}
          .motion-ready .case:nth-child(3).motion-in .caso-icono path:nth-child(3){transition-delay:.20s}

          @media (hover:hover) and (pointer:fine){
            .case:hover{
              transform:translateY(-4px);
              border-color:rgba(212,175,55,.34);
              box-shadow:0 20px 46px -30px rgba(10,25,47,.42)
            }
          }

          @media (min-width:1000px) and (hover:hover) and (pointer:fine){
            .hero .method{
              translate:var(--hero-depth-x,0px) var(--hero-depth-y,0px);
              transition:translate .62s cubic-bezier(.22,1,.36,1),border-color .35s ease,box-shadow .35s ease;
              will-change:translate
            }
          }

          @media (prefers-reduced-motion:reduce){
            .btn--gold::after{display:none!important;animation:none!important}
            .reveal{transition-delay:0ms!important}
            .motion-ready .caso-icono path{stroke-dashoffset:0!important;transition:none!important}
            .hero .method{translate:0 0!important;will-change:auto!important}
            .case{transform:none!important}
          }
          </style>'''

          script = r'''<script id="premium-motion-v1-js">
          (()=>{
            'use strict';
            const root=document.documentElement;
            root.classList.add('motion-ready');
            const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');

            // Coordinate existing reveal elements into a quiet 70 ms cascade per section.
            document.querySelectorAll('.section').forEach(section=>{
              section.querySelectorAll('.reveal').forEach((el,index)=>{
                el.style.setProperty('--motion-delay',`${Math.min(index,6)*70}ms`);
              });
            });

            // Draw the three illustrative SVGs once, only when they actually enter view.
            const cases=[...document.querySelectorAll('.case')];
            if(reduce.matches || !('IntersectionObserver' in window)){
              cases.forEach(card=>card.classList.add('motion-in'));
            }else if(cases.length){
              const caseObserver=new IntersectionObserver(entries=>{
                entries.forEach(entry=>{
                  if(!entry.isIntersecting) return;
                  entry.target.classList.add('motion-in');
                  caseObserver.unobserve(entry.target);
                });
              },{threshold:.28,rootMargin:'0px 0px -7% 0px'});
              cases.forEach(card=>caseObserver.observe(card));
            }

            // Desktop-only depth: a few pixels, deliberately below “3D effect” territory.
            const hero=document.querySelector('.hero');
            const method=hero?.querySelector('.method');
            const finePointer=window.matchMedia('(min-width:1000px) and (hover:hover) and (pointer:fine)');
            if(hero && method && finePointer.matches && !reduce.matches){
              let raf=0;
              const reset=()=>{
                method.style.setProperty('--hero-depth-x','0px');
                method.style.setProperty('--hero-depth-y','0px');
              };
              hero.addEventListener('pointermove',event=>{
                cancelAnimationFrame(raf);
                raf=requestAnimationFrame(()=>{
                  const rect=hero.getBoundingClientRect();
                  const nx=((event.clientX-rect.left)/rect.width)-.5;
                  const ny=((event.clientY-rect.top)/rect.height)-.5;
                  method.style.setProperty('--hero-depth-x',`${(-nx*10).toFixed(2)}px`);
                  method.style.setProperty('--hero-depth-y',`${(-ny*7).toFixed(2)}px`);
                });
              },{passive:true});
              hero.addEventListener('pointerleave',reset,{passive:true});
            }
          })();
          </script>'''

          # Idempotent: replace this layer if the workflow is re-run instead of duplicating it.
          text = re.sub(r'\n?<style id="premium-motion-v1">.*?</style>\n?', '\n', text, flags=re.S)
          text = re.sub(r'\n?<script id="premium-motion-v1-js">.*?</script>\n?', '\n', text, flags=re.S)

          if '</head>' not in text or '</body>' not in text:
              raise SystemExit('index.html is missing </head> or </body>; refusing to modify it.')

          text = text.replace('</head>', style + '\n</head>', 1)
          text = text.replace('</body>', script + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Sanity checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'motion style': s.count('id="premium-motion-v1"')==1,
            'motion script': s.count('id="premium-motion-v1-js"')==1,
            'reduced motion': 'prefers-reduced-motion:reduce' in s,
            'case motion': 'caseObserver' in s,
            'hero depth': '--hero-depth-x' in s,
            'document ending': '</html>' in s,
          }
          bad=[name for name,ok in checks.items() if not ok]
          if bad: raise SystemExit('Sanity checks failed: '+', '.join(bad))
          print('All premium-motion sanity checks passed.')
          PY

      - name: Commit index update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: refine premium motion and microinteractions'
          git push origin HEAD:main
