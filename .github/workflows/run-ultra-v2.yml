name: Execute Ultra Calculator Upgrade

on:
  push:
    paths:
      - '.github/workflows/run-ultra-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply ultra calculator layer
        run: python3 .github/apply_ultra_runner.py
      - name: Verify and publish
        shell: bash
        run: |
          grep -q 'id="ultra-calc-v1"' index.html
          grep -q 'id="ultra-calc-v1-js"' index.html
          grep -q 'window.InsuranceCalculators' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'feat: add ultra-modern calculator visual intelligence'
          git push origin HEAD:main
